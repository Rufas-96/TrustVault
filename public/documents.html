<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My documents · TrustVault</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css?v=10">
<script src="/js/intro.js?v=10"></script>
<script src="/js/common.js?v=10" defer></script>
<script src="/js/doclist.js?v=10" defer></script>
</head>
<body>
<div class="shell">
<div class="main">
<header class="appbar" id="topbar"></header>
<main class="content" id="content">
<div id="doclist" data-scope="mine" data-active="/documents" data-roles="owner"></div>
<div class="page-head">
  <div><h1>My documents</h1><p>Documents you own. Only you decide who else can see each one.</p></div>
  <div class="actions"><a class="btn primary" href="/upload"><svg class="icon sm" aria-hidden="true"><use href="/img/icons.svg#upload"/></svg>Upload document</a></div>
</div>
<section class="card">
  <form class="filters" id="filters">
    <div class="field grow"><label for="f-q">Name contains</label><input type="search" id="f-q" name="q" placeholder="Title, description or file name"></div>
    <div class="field"><label for="f-category">Category</label><select id="f-category" name="category"><option value="">All categories</option></select></div><div class="field"><label for="f-sort">Sort by</label><select id="f-sort" name="sort"><option value="updated">Last updated</option><option value="created">Uploaded</option><option value="title">Title</option></select></div>
    <div class="actions"><button class="btn primary" type="submit"><svg class="icon sm" aria-hidden="true"><use href="/img/icons.svg#search"/></svg>Search</button><button class="btn" type="reset">Clear</button></div>
  </form>
  <div class="card-body flush" id="results"></div>
</section>
</main>
</div>
</div>
</body>
</html>
